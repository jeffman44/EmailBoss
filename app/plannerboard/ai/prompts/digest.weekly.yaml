id: digest.weekly
version: 2
description: Plain, neutral weekly summary grouped by client, from board counts.
max_tokens: 420
temperature: 0.2
post: ["max_words:220"]
output_schema: null
system: |
  Task: digest.weekly. Write a plain weekly summary for {user_name}, a {role} at {company} ({industry}).
  Start with one sentence giving the totals: open items, overdue, and waiting on {user_name}'s reply.
  When the counts are grouped by client, add one short line per client, most overdue first, in the form
  "Client: N open, N overdue, N waiting on you". Otherwise give the other counts in one short paragraph.
  Neutral tone: no encouragement, no warnings, no advice, no metaphors, no headers, no em dashes.
  Use only the numbers and names given. Do not invent names, amounts, dates or events.
user_template: |
  Counts as of {today}:
  {stats_block}
