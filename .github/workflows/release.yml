name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload the build to (e.g. v1.2.0); blank = artifact only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "app[dev,tray,attachments,http,encrypt]" -e license_server pytest httpx
      - run: make check PY=python   # compileall, banned literals, em dashes, both pytest suites

  # 2.0 Phase 0: baseline benchmark on Windows against a generated 50k-message
  # mailbox. Bounds live in app/tests/bench/thresholds.json (null = record only).
  bench:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e "app[dev,attachments,http]" pytest
      - name: Bench
        shell: pwsh
        env:
          EB_BENCH: "1"
          EB_BENCH_OUT: ${{ github.workspace }}\app\bench.json
        run: |
          cd app
          python -m pytest -q tests/bench -s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.run_id }}
          path: app/bench.json
          if-no-files-found: warn

  # 2.0 Phase 1: does SQLCipher install, run and freeze on Windows? The store
  # ships encryption behind PB_STORE_ENCRYPT only if this job is green.
  sqlcipher:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e "app[dev,attachments,http,encrypt]" pytest pyinstaller
      - name: Probe (interpreter)
        shell: pwsh
        run: python app\scripts\sqlcipher_probe.py
      - name: Probe (PyInstaller one-file exe)
        shell: pwsh
        run: |
          pyinstaller --onefile --name sqlcipher_probe --collect-all sqlcipher3 --distpath probe_dist --workpath probe_build app\scripts\sqlcipher_probe.py
          .\probe_dist\sqlcipher_probe.exe
          if ($LASTEXITCODE -ne 0) { throw "frozen probe failed" }
      - name: Store encryption tests
        shell: pwsh
        run: |
          cd app
          python -m pytest -q tests/test_store_search.py

  windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write   # only this job uploads release assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e "app[dev,tray,attachments,http,desktop,encrypt]" pyinstaller build
      - name: Build bundle (release channel)
        shell: pwsh
        env:
          PB_GMAIL_CLIENT_ID: ${{ secrets.PB_GMAIL_CLIENT_ID }}
          PB_GMAIL_CLIENT_SECRET: ${{ secrets.PB_GMAIL_CLIENT_SECRET }}
          PB_GRAPH_CLIENT_ID: ${{ secrets.PB_GRAPH_CLIENT_ID }}
        run: app\scripts\build_release.ps1 -Python python
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc /DAppVersion=${{ steps.v.outputs.version }} app\installer\emailboss.iss
          $lines = Get-ChildItem app\dist\*Setup.exe, app\dist\*.zip, app\dist\*.whl | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Set-Content app\dist\SHA256SUMS.txt -Encoding ASCII
          $lines
      - name: Signed update manifest
        shell: pwsh
        env:
          EB_RELEASE_SIGNING_KEY: ${{ secrets.EB_RELEASE_SIGNING_KEY }}
          IS_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && 'yes' || 'no' }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if (-not $env:EB_RELEASE_SIGNING_KEY) {
            if ($env:IS_RELEASE -eq 'yes') { throw "secret EB_RELEASE_SIGNING_KEY is not set: refusing to publish a release without update.json" }
            Write-Host "EB_RELEASE_SIGNING_KEY not set; skipping update.json (not a release build)"
            exit 0
          }
          $ver  = "${{ steps.v.outputs.version }}"
          $tag  = if ($env:IS_RELEASE -eq 'yes') { $env:RELEASE_TAG } else { "v$ver" }
          $exe  = (Get-ChildItem app\dist\*Setup.exe | Select-Object -First 1).FullName
          $url  = "https://github.com/${{ github.repository }}/releases/download/$tag/" + (Split-Path $exe -Leaf)
          $key  = Join-Path $env:RUNNER_TEMP "release_signing_key.pem"
          Set-Content -Path $key -Value $env:EB_RELEASE_SIGNING_KEY -NoNewline -Encoding ascii
          try {
            python app\scripts\make_update_manifest.py --version $ver --exe $exe --url $url --key $key --out app\dist --verify
            if ($LASTEXITCODE -ne 0) { throw "make_update_manifest.py failed" }
          } finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: EmailBoss-${{ steps.v.outputs.version }}-windows
          path: |
            app/dist/*Setup.exe
            app/dist/*.zip
            app/dist/*.whl
            app/dist/SHA256SUMS.txt
            app/dist/update.json
            app/dist/update.json.sig
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            app/dist/*Setup.exe
            app/dist/*.zip
            app/dist/*.whl
            app/dist/SHA256SUMS.txt
            app/dist/update.json
            app/dist/update.json.sig
          generate_release_notes: false
          body_path: docs/RELEASE_NOTES.md
